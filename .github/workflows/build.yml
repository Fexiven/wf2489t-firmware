# Builds the firmware exactly like a local `make`: same pinned build container,
# same pinned sources. The results are attached to each run as artifacts; on
# master the apt repository is published on GitHub Pages (signed with the
# WF2489T_SIGNING_KEY secret).
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build TF-A + U-Boot
        run: make uboot
      - uses: actions/upload-artifact@v7
        with:
          name: uboot
          path: out/uboot-copy1.img
          if-no-files-found: error

  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # package versions come from the commit history
      - name: Reuse the published kernel if kernel/ and dts/ are unchanged
        id: reuse
        run: |
          v=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d.%H%M -- kernel dts)
          url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          mkdir -p out/kernel
          curl -sSf $url/Packages | awk -v v="$v" 'BEGIN { RS = "" }
            /\nVersion: / && index($0, "\nVersion: " v "\n") && /^Package: (linux-image|aic8800-sdio-modules)/ {
              match($0, /\nFilename: [^\n]*/); print substr($0, RSTART + 11, RLENGTH - 11) }' > files || true
          if [ "$(wc -l < files)" = 3 ]; then
            while read f; do curl -sSf -o out/kernel/${f#./} $url/${f#./}; done < files
            echo reused=true >> $GITHUB_OUTPUT
          fi
      - name: Free disk space
        if: steps.reuse.outputs.reused != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build kernel packages
        if: steps.reuse.outputs.reused != 'true'
        run: make kernel
      - uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: out/kernel/*.deb
          if-no-files-found: error

  repo:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: kernel
          path: out/kernel
      - name: Build the apt repository
        env:
          WF2489T_SIGNING_KEY: ${{ secrets.WF2489T_SIGNING_KEY }}
        run: make repo
      - uses: actions/upload-artifact@v7
        with:
          name: repo
          path: out/repo
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: out/repo

  pages:
    needs: repo
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  image:
    needs: repo
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: repo
          path: out/repo
      - name: Allow KVM for debos
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build Debian image
        run: make image
      - name: Compress
        run: xz -T0 -6 out/root.ext4
      - uses: actions/upload-artifact@v7
        with:
          name: debian-root
          path: out/root.ext4.xz
          if-no-files-found: error
