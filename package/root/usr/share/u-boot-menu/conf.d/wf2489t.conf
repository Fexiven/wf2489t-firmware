# u-boot-menu (extlinux.conf): root filesystem by label; boot splash on the
# display, kernel and systemd messages on the debug UART (ttyS0)
U_BOOT_ROOT="root=LABEL=root"
U_BOOT_PARAMETERS="console=tty1 console=ttyS0,1500000n8 earlycon=uart8250,mmio32,0x2ad40000 rootwait rw quiet splash loglevel=3 plymouth.ignore-serial-consoles vt.global_cursor_default=0"
U_BOOT_TIMEOUT="10"
